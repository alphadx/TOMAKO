services:
  app:
    build: .
    container_name: tomako_app
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html:cached
    env_file:
      - .env.docker
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tomako_db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: {}